<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Approval Panel</title>

  <script src="https://cdn.tailwindcss.com"></script>
<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
>
</head>

<body class="bg-slate-100 min-h-screen font-[Prompt]">

  <!-- HEADER -->

  <header class="bg-slate-900 text-white shadow-lg">


<div class="max-w-7xl mx-auto px-6 py-4">

  <h1 class="text-2xl font-bold">
    Scaffold Approval Panel
  </h1>

  <p class="text-slate-300 text-sm">
    Pending Request Management
  </p>

</div>


  </header>

  <!-- CONTENT -->

  <main class="max-w-7xl mx-auto p-6">


<div class="bg-white rounded-xl shadow-sm p-6">

  <div class="flex justify-between items-center mb-6">

    <h2 class="text-xl font-bold">
      Pending Requests
    </h2>

    <button
      id="refreshBtn"
      class="bg-blue-600 text-white px-4 py-2 rounded-lg"
    >
      Refresh
    </button>

  </div>

  <!-- TABLE -->

  <div class="overflow-auto">

    <table class="w-full border-collapse">

      <thead>

        <tr class="bg-slate-100">

          <th class="border p-3 text-center">
            Job ID
          </th>

          <th class="border p-3 text-center">
            Description
          </th>

          <th class="border p-3 text-center">
            Area
          </th>

          <th class="border p-3 text-center">
            Work Type
          </th>

          <th class="border p-3 text-center">
            Quantity
          </th>

          <th class="border p-3 text-center">
            Due Date
          </th>
          
          <th class="border p-3 text-center w-[90px]">
            Images
          </th>

          <th class="border p-3 text-center">
            Action
          </th>

        </tr>

      </thead>

      <tbody id="jobTableBody" class="divide-y divide-slate-200">

      </tbody>

    </table>

    <div class="flex justify-center items-center gap-4 mt-6">

  <button
    onclick="prevPage()"
    class="bg-slate-300 px-4 py-2 rounded-lg"
  >
    ← Back
  </button>

  <span id="pageInfo" class="font-semibold">
    Page 1
  </span>

  <button
    onclick="nextPage()"
    class="bg-slate-300 px-4 py-2 rounded-lg"
  >
    Next →
  </button>

</div>

  </div>

</div>


  </main>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbx6QV2vjlV_Oyp-5gQrke1smMrGORzccv2o_Q-Wf2PPYBNDwWgtLAp-KCMwjgxjEyPW/exec';
let currentPage = 1;

const rowsPerPage = 15;

let allJobs = [];
// =====================
// LOAD PENDING JOBS
// =====================

async function loadPendingJobs() {

  try {

    const response = await fetch(
     const response = await fetch(
  `${API_URL}?action=getPendingJobs`
);

allJobs = await response.json();

console.log(allJobs);

  } catch(error) {

  console.error(error);

  alert(error.message);

}

}
function formatDate(dateString) {

  if(!dateString) return '-';

  const date = new Date(dateString);

  return date.toLocaleDateString('en-GB', {

    day: '2-digit',
    month: 'short',
    year: 'numeric'

  });

}
// =====================
// APPROVE JOB
// =====================

async function approveJob(jobId) {

  try {

    const response = await fetch(

      `${API_URL}?action=approveJob&jobId=${jobId}&approver=manager1`

    );

    const result = await response.json();

    if(result.success) {

      alert('Job Approved');

      loadPendingJobs();

    } else {

      alert('Approve Failed');

    }

  } catch(error) {

    console.error(error);

    alert('Approve Error');

  }

}

// =====================
// REJECT JOB
// =====================

async function rejectJob(jobId) {

  const reason =
    prompt('Enter reject reason');

  if(!reason) return;

  try {

    const response = await fetch(

      `${API_URL}?action=rejectJob&jobId=${jobId}&reason=${encodeURIComponent(reason)}&approver=manager1`

    );

    const result = await response.json();

    if(result.success) {

      alert('Job Rejected');

      loadPendingJobs();

    } else {

      alert('Reject Failed');

    }

  } catch(error) {

    console.error(error);

    alert('Reject Error');

  }

}

// =====================
// REFRESH
// =====================

document
.getElementById('refreshBtn')
.addEventListener('click', async () => {

  const btn =
    document.getElementById('refreshBtn');

  btn.disabled = true;

  btn.innerText = 'Refreshing...';

  await loadPendingJobs();

  btn.disabled = false;

  btn.innerText = 'Refresh';

});

// INITIAL LOAD

loadPendingJobs();
  
function showImages(images) {

  if (!images || images.length === 0) {

    alert("No Image");
    return;

  }

  const popup = document.createElement("div");

  popup.id = "imagePopup";

  popup.className =
    "fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50";

  let html = "";

  images.forEach(link => {

    html += `

      <div class="mb-6">

        <img
          src="${link}"
          class="w-full max-h-[70vh] object-contain rounded-xl border"
        />

        <div class="mt-2">

          <a
            href="${link}"
            target="_blank"
            class="text-blue-600 underline break-all"
          >
            Open Full Image
          </a>

        </div>

      </div>

    `;

  });

  popup.innerHTML = `

    <div class="bg-white rounded-2xl p-6 max-w-4xl w-full mx-4 relative overflow-auto max-h-[90vh]">

      <div class="flex justify-between items-center mb-4">

        <h2 class="text-3xl font-bold">

          Job Images

        </h2>

        <button
          onclick="closeImagePopup()"
          class="bg-red-500 text-white px-5 py-2 rounded-lg"
        >
          Close
        </button>

      </div>

      ${html}

    </div>

  `;

  document.body.appendChild(popup);

}

function closeImagePopup() {

  document.getElementById('imagePopup')
  ?.remove();

}

function updatePageInfo() {

  const totalPages =
    Math.ceil(allJobs.length / rowsPerPage);

  document.getElementById('pageInfo')
  .innerText =
    `Page ${currentPage} / ${totalPages}`;

  document.querySelector(
    'button[onclick="prevPage()"]'
  ).disabled = currentPage === 1;

  document.querySelector(
    'button[onclick="nextPage()"]'
  ).disabled = currentPage === totalPages;

}
function renderCurrentPage() {

  const tbody =
    document.getElementById('jobTableBody');

  tbody.innerHTML = '';

  const start =
    (currentPage - 1) * rowsPerPage;

  const end =
    start + rowsPerPage;

  const pageJobs =
    allJobs.slice(start, end);
  
let html = '';
  
  pageJobs.forEach(job => {

    const row = `

      <tr>

        <td class="border p-3 text-center">
          ${job.jobId}
        </td>

        <td class="border p-3 text-left">
          ${job.description}
        </td>

        <td class="border p-3 text-center">
          ${job.area}
        </td>

        <td class="border p-3 text-center">
          ${job.workType}
        </td>

        <td class="border p-3 text-center">
          ${job.quantity} m³
        </td>

        <td class="border p-3 text-center">
          ${formatDate(job.dueDate)}
        </td>

        <td class="border p-3 text-center whitespace-nowrap">

          ${
            job.images && job.images.length > 0
            ?
            `<button
  onclick='showImages(${JSON.stringify(job.images || [])})'
  class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-xs inline-block"
>
  View
</button>`
            :
            '-'
          }

        </td>

        <td class="border p-3">

          <div class="flex justify-center gap-2">

            <button
              onclick="approveJob('${job.jobId}')"
              class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg"
            >
              Approve
            </button>

            <button
              onclick="rejectJob('${job.jobId}')"
              class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg"
            >
              Reject
            </button>

          </div>

        </td>

      </tr>

    `;

    html += row;

  });

tbody.innerHTML = html;

updatePageInfo();

}
function nextPage() {

  const totalPages =
    Math.ceil(allJobs.length / rowsPerPage);

  if(currentPage < totalPages){

    currentPage++;

    renderCurrentPage();

  }

}

function prevPage() {

  if(currentPage > 1){

    currentPage--;

    renderCurrentPage();

  }

}
</script>

</body>
</html>
